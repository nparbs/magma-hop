# See docs/hosting.md. Reuses Scrap Riot's Cloudflare Tunnel by joining its Docker network.
services:
  magmahop:
    build: .
    restart: unless-stopped
    environment:
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://magmahop.parbs.online}
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-cf-connecting-ip}
      DAILY_SECRET: ${DAILY_SECRET:-}
    # No published ports: only the tunnel can reach it, so the client IP header can be trusted.
    expose:
      - "8794"
    volumes:
      - magmahop_data:/data
    networks:
      - tunnel
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 64

volumes:
  magmahop_data:

networks:
  tunnel:
    external: true
    name: ${TUNNEL_NETWORK:-scrap-riot_default}
